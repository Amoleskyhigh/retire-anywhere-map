<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retire Anywhere Lab v3（Production風格 + 比較功能）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--cyan:#00bcd4;--bg:#0f172a;--panel:rgba(15,23,42,.93);--txt:#f8fafc;--g:#10b981;--p:#a855f7;--b:#3b82f6;--r:#ef4444}
    *{box-sizing:border-box} body,html{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    #map{height:68vh;min-height:420px}
    .mapWrap{position:relative}
    .ui-panel{position:absolute;top:16px;right:16px;z-index:1000;width:330px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;backdrop-filter:blur(10px)}
    .legend{position:absolute;left:16px;bottom:16px;z-index:1000;display:flex;gap:14px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:12px}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
    h1{font-size:22px;margin:0 0 8px}.sub{opacity:.75;font-size:13px;margin-bottom:8px}
    .group{margin:10px 0} label{font-size:12px;opacity:.85;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
    .btns{display:flex;gap:6px}.btn{flex:1;padding:8px 6px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;font-size:12px}
    .btn.active[data-type="lifestyle"][data-val="Essential"]{border-color:var(--p);background:rgba(168,85,247,.22)}
    .btn.active[data-type="lifestyle"][data-val="Comfortable"]{border-color:var(--b);background:rgba(59,130,246,.22)}
    .btn.active[data-type="lifestyle"][data-val="Luxury"]{border-color:var(--g);background:rgba(16,185,129,.22)}
    .btn.active[data-type="household"]{border-color:var(--cyan);background:rgba(0,188,212,.2)}
    input[type=range]{width:100%;accent-color:var(--cyan)}
    .budget{font-weight:700;color:var(--cyan)}
    .container{padding:14px;max-width:1180px;margin:0 auto}
    .card{background:#121b2f;border:1px solid #243252;border-radius:14px;padding:14px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap} select,button{background:#0d1527;color:#fff;border:1px solid #30456e;border-radius:10px;padding:8px}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px} th,td{border-bottom:1px solid #23365c;padding:10px;text-align:left} th{color:#a9b7d4}
    .score{font-weight:700;color:#66e0ff}.chip{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;margin:4px;border:1px solid #2d3f67}
    .ok{background:#10331f;border-color:#2f7d51;color:#7de3a5}.todo{background:#3a1e22;border-color:#7b3c46;color:#ff9da9}
    .photo{width:150px;height:85px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid rgba(255,255,255,.16)}
    @media(max-width:760px){.ui-panel{left:10px;right:10px;width:auto;top:10px}.legend{left:10px;right:10px;bottom:10px;justify-content:space-between;font-size:11px}}
  </style>
</head>
<body>
<div class="container">
  <h1>Retire Anywhere Lab v3</h1>
  <div class="sub">保留 production 的 lifestyle / household / asset slider 與顏色語意；地圖在上、比較區在下。</div>
</div>
<div class="mapWrap">
  <div id="map"></div>
  <div class="ui-panel">
    <div class="group">
      <label>Life Style</label>
      <div class="btns">
        <button class="btn active" data-type="lifestyle" data-val="Essential" onclick="setChoice('lifestyle','Essential')">Essential</button>
        <button class="btn" data-type="lifestyle" data-val="Comfortable" onclick="setChoice('lifestyle','Comfortable')">Comfortable</button>
        <button class="btn" data-type="lifestyle" data-val="Luxury" onclick="setChoice('lifestyle','Luxury')">Luxury</button>
      </div>
    </div>
    <div class="group">
      <label>Household</label>
      <div class="btns">
        <button class="btn active" data-type="household" data-val="single" onclick="setChoice('household','single')">Single</button>
        <button class="btn" data-type="household" data-val="couple" onclick="setChoice('household','couple')">Couple</button>
        <button class="btn" data-type="household" data-val="family" onclick="setChoice('household','family')">Family</button>
      </div>
    </div>
    <div class="group">
      <label>Assets (USD): <span class="budget" id="budgetTxt">$3,000,000</span></label>
      <input id="assetSlider" type="range" min="100000" max="10000000" step="50000" value="3000000" />
    </div>
    <div class="group" style="font-size:12px;opacity:.85">顯示規則：你目前選的 lifestyle + household + assets 可負擔城市。</div>
  </div>
  <div class="legend">
    <div><span class="dot" style="background:var(--g)"></span>Luxury 可負擔</div>
    <div><span class="dot" style="background:var(--b)"></span>Comfortable 可負擔</div>
    <div><span class="dot" style="background:var(--p)"></span>Essential 可負擔</div>
    <div><span class="dot" style="background:var(--r)"></span>超出資產</div>
  </div>
</div>

<div class="container">
  <div class="card">
    <h3>城市選擇（洲 → 國家 → 城市）＋比較</h3>
    <div class="row">
      <select id="continentSel"><option value="">先選洲</option></select>
      <select id="countrySel" disabled><option value="">再選國家</option></select>
      <select id="citySel" disabled><option value="">最後選城市</option></select>
      <button onclick="addFromSelectors()">加入比較</button>
      <button onclick="clearCompare()">清空比較</button>
    </div>
    <div id="selected" style="margin-top:8px;font-size:13px;opacity:.85"></div>
    <table id="cmp" style="display:none"><thead><tr><th>維度</th><th id="h1"></th><th id="h2"></th><th id="h3"></th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h3>2025 Top 15 缺口盤點（已補第一批6國）</h3>
    <div id="gap"></div>
    <div id="gapSummary" style="opacity:.8;margin-top:6px"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const top15=['Portugal','Mauritius','Spain','Uruguay','Austria','Italy','Slovenia','Malta','Latvia','Chile','Costa Rica','Greece','Paraguay','Cyprus','Seychelles'];
const countryCont={USA:'North America',Japan:'Asia',Taiwan:'Asia',Thailand:'Asia',Spain:'Europe',Portugal:'Europe',Malaysia:'Asia','Costa Rica':'North America',Mexico:'North America',Panama:'North America',Greece:'Europe',Malta:'Europe',Uruguay:'South America',Cyprus:'Europe',Italy:'Europe',Chile:'South America'};
const photos={Athens:'https://images.unsplash.com/photo-1555992828-ca4dbe41d294?auto=format&fit=crop&w=500&q=60',Thessaloniki:'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=500&q=60',Heraklion:'https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=500&q=60',Valletta:'https://images.unsplash.com/photo-1578926375605-eaf7559b1458?auto=format&fit=crop&w=500&q=60',Sliema:'https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=500&q=60',Gozo:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=60',Montevideo:'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=500&q=60',Punta_del_Este:'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=500&q=60',Colonia:'https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=500&q=60',Nicosia:'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=500&q=60',Limassol:'https://images.unsplash.com/photo-1441829266145-b7a6f00aa15f?auto=format&fit=crop&w=500&q=60',Paphos:'https://images.unsplash.com/photo-1505764706515-aa95265c5abc?auto=format&fit=crop&w=500&q=60',Rome:'https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=500&q=60',Florence:'https://images.unsplash.com/photo-1471623817296-aa07ae5c9f47?auto=format&fit=crop&w=500&q=60',Palermo:'https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=500&q=60',Santiago:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=500&q=60',Valparaiso:'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=500&q=60',Vina_del_Mar:'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=500&q=60'};
const meta={USA:[7,4,8,7,5,8,10],Japan:[6,5,9,10,6,6,4],Taiwan:[7,6,9,9,6,7,5],Thailand:[8,7,8,7,7,9,6],Spain:[9,8,9,8,7,9,7],Portugal:[9,8,8,9,8,9,8],Malaysia:[8,7,8,7,7,8,7],'Costa Rica':[9,8,8,8,7,9,7],Mexico:[8,7,7,6,7,9,6],Panama:[9,8,7,7,8,8,6],Greece:[9,7,7,7,8,8,7],Malta:[9,8,8,8,8,9,10],Uruguay:[8,7,8,8,8,7,5],Cyprus:[9,8,8,8,8,8,9],Italy:[8,7,8,7,6,8,6],Chile:[7,7,8,7,7,7,5]};
const batch6={Greece:{Cities:{Athens:{coords:[37.9838,23.7275],monthly_living_cost_single:1700,monthly_living_cost_couple:2500,monthly_living_cost_family:3900},Thessaloniki:{coords:[40.6401,22.9444],monthly_living_cost_single:1400,monthly_living_cost_couple:2100,monthly_living_cost_family:3300},Heraklion:{coords:[35.3387,25.1442],monthly_living_cost_single:1500,monthly_living_cost_couple:2200,monthly_living_cost_family:3400}}},Malta:{Cities:{Valletta:{coords:[35.8989,14.5146],monthly_living_cost_single:1900,monthly_living_cost_couple:2800,monthly_living_cost_family:4300},Sliema:{coords:[35.9122,14.5044],monthly_living_cost_single:2000,monthly_living_cost_couple:3000,monthly_living_cost_family:4600},Gozo:{coords:[36.0443,14.2512],monthly_living_cost_single:1700,monthly_living_cost_couple:2500,monthly_living_cost_family:3900}}},Uruguay:{Cities:{Montevideo:{coords:[-34.9011,-56.1645],monthly_living_cost_single:1600,monthly_living_cost_couple:2300,monthly_living_cost_family:3600},Punta_del_Este:{coords:[-34.9689,-54.9446],monthly_living_cost_single:1800,monthly_living_cost_couple:2600,monthly_living_cost_family:4100},Colonia:{coords:[-34.4698,-57.8433],monthly_living_cost_single:1400,monthly_living_cost_couple:2100,monthly_living_cost_family:3300}}},Cyprus:{Cities:{Nicosia:{coords:[35.1856,33.3823],monthly_living_cost_single:1800,monthly_living_cost_couple:2600,monthly_living_cost_family:4000},Limassol:{coords:[34.7071,33.0226],monthly_living_cost_single:2000,monthly_living_cost_couple:2900,monthly_living_cost_family:4500},Paphos:{coords:[34.772,32.4297],monthly_living_cost_single:1700,monthly_living_cost_couple:2500,monthly_living_cost_family:3900}}},Italy:{Cities:{Rome:{coords:[41.9028,12.4964],monthly_living_cost_single:2100,monthly_living_cost_couple:3000,monthly_living_cost_family:4700},Florence:{coords:[43.7696,11.2558],monthly_living_cost_single:1900,monthly_living_cost_couple:2800,monthly_living_cost_family:4400},Palermo:{coords:[38.1157,13.3615],monthly_living_cost_single:1500,monthly_living_cost_couple:2200,monthly_living_cost_family:3400}}},Chile:{Cities:{Santiago:{coords:[-33.4489,-70.6693],monthly_living_cost_single:1600,monthly_living_cost_couple:2300,monthly_living_cost_family:3600},Valparaiso:{coords:[-33.0472,-71.6127],monthly_living_cost_single:1400,monthly_living_cost_couple:2100,monthly_living_cost_family:3300},Vina_del_Mar:{coords:[-33.0245,-71.5518],monthly_living_cost_single:1500,monthly_living_cost_couple:2200,monthly_living_cost_family:3500}}}};
let state={lifestyle:'Essential',household:'single',asset:3000000},cities=[],selected=[]; let map,layer;
const lifeMul={Essential:0.85,Comfortable:1,Luxury:1.25};
const markerColor={Luxury:'#10b981',Comfortable:'#3b82f6',Essential:'#a855f7',None:'#ef4444'};
function usd(n){return '$'+Math.round(n).toLocaleString();}
function annualNeed(c,house){const m=house==='single'?c.monthly_living_cost_single:house==='couple'?c.monthly_living_cost_couple:c.monthly_living_cost_family; return m*12;}
function assetNeed(c,house,life){return annualNeed(c,house)*25*lifeMul[life];}
function level(c,house,asset){const e=assetNeed(c,house,'Essential'),k=assetNeed(c,house,'Comfortable'),l=assetNeed(c,house,'Luxury'); if(asset>=l) return 'Luxury'; if(asset>=k) return 'Comfortable'; if(asset>=e) return 'Essential'; return 'None';}
function pin(color){return L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)"></div>`,iconSize:[14,14]});}
function setChoice(type,val){state[type]=val; document.querySelectorAll(`.btn[data-type='${type}']`).forEach(b=>b.classList.toggle('active',b.dataset.val===val)); draw();}
function score(c){const [cl,vi,he,sa,ta,ex,en]=meta[c.country]||[6,6,6,6,6,6,6]; const annual=annualNeed(c,state.household)*lifeMul[state.lifestyle]; const fund=annual<=30000?10:annual<=45000?8:annual<=60000?6:annual<=80000?4:2; const total=(fund*.3+cl*.1+vi*.15+he*.15+sa*.1+ta*.1+ex*.05+en*.05).toFixed(2); return {annual,fund,cl,vi,he,sa,ta,ex,en,total};}
function draw(){layer.clearLayers(); const filtered=[];
  cities.forEach((c,i)=>{const lv=level(c,state.household,state.asset); const show=lv!=='None' ? (['Essential','Comfortable','Luxury'].indexOf(lv)>=['Essential','Comfortable','Luxury'].indexOf(state.lifestyle)) : false; if(!show) return; filtered.push(c);
    const s=score(c),img=photos[c.city]||'https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=500&q=60';
    const mk=L.marker(c.coords,{icon:pin(markerColor[lv])}).addTo(layer);
    mk.bindPopup(`<b>${c.country} - ${c.city}</b><br/>可負擔等級：<b style='color:${markerColor[lv]}'>${lv}</b><br/>年生活費（${state.household}/${state.lifestyle}）：${usd(s.annual)}<br/>建議退休資產：${usd(assetNeed(c,state.household,state.lifestyle))}<br/><button onclick="addCmp(${i})">加入比較</button><br/><img class='photo' src='${img}' alt='${c.city}'/>`);
  });
}
function buildSelectors(){const cont=[...new Set(cities.map(c=>c.continent))].sort(); const c1=document.getElementById('continentSel'),c2=document.getElementById('countrySel'),c3=document.getElementById('citySel');
  c1.innerHTML='<option value="">先選洲</option>'+cont.map(v=>`<option>${v}</option>`).join('');
  c1.onchange=()=>{const cc=[...new Set(cities.filter(c=>c.continent===c1.value).map(c=>c.country))].sort(); c2.innerHTML='<option value="">再選國家</option>'+cc.map(v=>`<option>${v}</option>`).join(''); c2.disabled=!c1.value; c3.innerHTML='<option value="">最後選城市</option>'; c3.disabled=true;};
  c2.onchange=()=>{const ci=cities.filter(c=>c.country===c2.value).map(c=>c.city).sort(); c3.innerHTML='<option value="">最後選城市</option>'+ci.map(v=>`<option>${v}</option>`).join(''); c3.disabled=!c2.value;};
}
function addFromSelectors(){const c1=document.getElementById('continentSel').value,c2=document.getElementById('countrySel').value,c3=document.getElementById('citySel').value; const i=cities.findIndex(c=>c.continent===c1&&c.country===c2&&c.city===c3); if(i>=0)addCmp(i)}
function addCmp(i){const c=cities[i]; if(!c) return; if(selected.find(x=>x.country===c.country&&x.city===c.city)) return; if(selected.length>=3) return alert('最多3個'); selected.push(c); renderCmp();}
window.addCmp=addCmp;
function clearCompare(){selected=[];renderCmp()} window.clearCompare=clearCompare;
function renderCmp(){document.getElementById('selected').textContent=selected.length?('已選：'+selected.map(c=>`${c.continent}/${c.country}/${c.city}`).join('、')):'尚未加入比較城市';
  const t=document.getElementById('cmp'); if(selected.length<2){t.style.display='none';return;} t.style.display='table';
  ['h1','h2','h3'].forEach((id,idx)=>document.getElementById(id).textContent=selected[idx]?`${selected[idx].country}-${selected[idx].city}`:'-');
  const m=selected.map(score),rows=[['每年資金需求',...m.map(x=>usd(x.annual))],['資金友善分數',...m.map(x=>x.fund)],['天氣',...m.map(x=>x.cl)],['簽證滿意度',...m.map(x=>x.vi)],['醫療品質',...m.map(x=>x.he)],['安全',...m.map(x=>x.sa)],['稅務友善',...m.map(x=>x.ta)],['外國人友善',...m.map(x=>x.ex)],['英文友善',...m.map(x=>x.en)],['加權總分',...m.map(x=>x.total)]];
  const tb=t.querySelector('tbody'); tb.innerHTML=''; rows.forEach((r,ri)=>{const tr=document.createElement('tr'); r.forEach((v,ci)=>{const td=document.createElement('td'); td.textContent=v; if(ri===rows.length-1&&ci>0) td.className='score'; tr.appendChild(td)}); tb.appendChild(tr)});
}
function renderGap(countries){const g=document.getElementById('gap'); g.innerHTML=''; const miss=[]; top15.forEach(c=>{const ok=countries.includes(c); if(!ok) miss.push(c); const s=document.createElement('span'); s.className='chip '+(ok?'ok':'todo'); s.textContent=(ok?'✅ ':'🟡 ')+c; g.appendChild(s)}); document.getElementById('gapSummary').textContent=`尚缺 ${miss.length} 國：${miss.join('、')||'已完整覆蓋'}`;}
async function init(){map=L.map('map').setView([20,10],2); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map); layer=L.layerGroup().addTo(map);
  const base=await fetch('./world_retirement_data.json').then(r=>r.json()); const merged={...base,...batch6}; const countries=Object.keys(merged);
  cities=[]; countries.forEach(country=>Object.entries(merged[country].Cities||{}).forEach(([city,info])=>cities.push({continent:countryCont[country]||'Other',country,city,...info})));
  renderGap(countries); buildSelectors(); draw(); renderCmp();
  const slider=document.getElementById('assetSlider'); slider.oninput=()=>{state.asset=Number(slider.value); document.getElementById('budgetTxt').textContent=usd(state.asset); draw(); renderCmp();};
}
init().catch(e=>alert('初始化失敗：'+e.message));
</script>
</body>
</html>
