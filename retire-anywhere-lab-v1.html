<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retire Anywhere Lab v5.8</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--cyan:#00bcd4;--bg:#0f172a;--panel:rgba(15,23,42,.94);--txt:#f8fafc;--g:#10b981;--p:#a855f7;--b:#3b82f6;--r:#ef4444}
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif}
    .container{max-width:1180px;margin:0 auto;padding:12px}
    #map{height:68vh;min-height:420px}
    .mapWrap{position:relative}

    .topline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px}
    h1{font-size:22px;margin:0}.sub{opacity:.78;font-size:13px}
    .lang-btn{background:#0d1527;color:#fff;border:1px solid #30456e;border-radius:8px;padding:6px 10px;cursor:pointer}

    .ui-panel{position:absolute;top:14px;right:14px;z-index:1100;width:334px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;backdrop-filter:blur(8px)}
    .ui-panel.collapsed{width:auto;padding:8px 10px}
    .ui-panel.collapsed .panel-body{display:none}
    .panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .btn-mini{background:#0d1527;color:#fff;border:1px solid #30456e;border-radius:8px;padding:6px 8px;cursor:pointer}
    .group{margin:12px 0} label{font-size:12px;opacity:.86;display:block;margin-bottom:6px}
    .btns{display:flex;gap:6px}
    .btn{flex:1;padding:8px 6px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;font-size:12px}
    .btn.active[data-type="lifestyle"][data-val="Essential"]{border-color:var(--p);background:rgba(168,85,247,.24)}
    .btn.active[data-type="lifestyle"][data-val="Comfortable"]{border-color:var(--b);background:rgba(59,130,246,.24)}
    .btn.active[data-type="lifestyle"][data-val="Luxury"]{border-color:var(--g);background:rgba(16,185,129,.24)}
    .btn.active[data-type="household"]{border-color:#f59e0b;background:rgba(245,158,11,.22)}
    input[type=range]{width:100%;accent-color:var(--cyan)} .budget{font-weight:700;color:var(--cyan)}

    .legend{position:absolute;left:14px;bottom:14px;z-index:1000;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
    .footer-info{position:absolute;right:14px;bottom:14px;z-index:1000;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:12px}

    .card{background:#121b2f;border:1px solid #243252;border-radius:14px;padding:14px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap} select,button{background:#0d1527;color:#fff;border:1px solid #30456e;border-radius:10px;padding:8px}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px} th,td{border-bottom:1px solid #23365c;padding:10px;text-align:left} th{color:#a9b7d4}
    .score{font-weight:700;color:#66e0ff}

    .modal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:14px}
    .modal.show{display:flex}
    .modal-box{width:min(760px,96vw);max-height:88vh;overflow:auto;background:#0f1a30;border:1px solid #29416e;border-radius:14px;padding:14px}
    .close{float:right;cursor:pointer;font-size:20px;padding:4px 8px}
    .city-img{width:100%;max-height:320px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.16)}

    .mobile-fab{display:none;position:absolute;left:14px;bottom:92px;z-index:1200;background:#0d1527;border:1px solid #30456e;color:#fff;padding:8px 10px;border-radius:10px}
    .mobile-sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:2500;background:#0f1a30;border-top:1px solid #29416e;border-radius:14px 14px 0 0;padding:12px;max-height:70vh;overflow:auto}
    .mobile-sheet.show{display:block}
    .sheet-head{display:flex;justify-content:space-between;align-items:center}
    .sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

    @media(max-width:760px){
      .ui-panel{display:none}
      .mobile-fab{display:block}
      .legend{left:10px;right:10px;bottom:52px;gap:8px;font-size:11px}
      .footer-info{right:10px;bottom:10px}
    }
  </style>
</head>
<body>
  <div class="topline">
    <div>
      <h1 id="t_title">Retire Anywhere Lab v5.8</h1>
      <div class="sub" id="t_sub">第一眼先回答：多少資產可以在哪裡退休。</div>
    </div>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>

  <div class="mapWrap">
    <div id="map"></div>

    <button class="mobile-fab" id="mobileFab">⚙ <span id="t_filters">篩選</span></button>

    <div class="ui-panel" id="panel">
      <div class="panel-top">
        <strong id="t_panel">Filters</strong>
        <div>
          <button class="btn-mini" id="methodBtn">Method</button>
          <button class="btn-mini" id="toggleBtn">收合</button>
        </div>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>

    <div class="legend">
      <div><span class="dot" style="background:var(--g)"></span><span id="t_lg_lux">Luxury 可負擔</span></div>
      <div><span class="dot" style="background:var(--b)"></span><span id="t_lg_com">Comfortable 可負擔</span></div>
      <div><span class="dot" style="background:var(--p)"></span><span id="t_lg_ess">Essential 可負擔</span></div>
      <div><span class="dot" style="background:var(--r)"></span><span id="t_lg_no">超出資產</span></div>
    </div>

    <div class="footer-info"><span id="t_visitors">Visitors</span>: <span id="visitor-val" style="color:var(--cyan)">-</span></div>
  </div>

  <div class="mobile-sheet" id="mobileSheet">
    <div class="sheet-head">
      <strong id="t_mobile_filters">篩選條件</strong>
      <button class="btn-mini" id="closeSheetBtn">✕</button>
    </div>
    <div id="mobileSheetBody"></div>
    <div class="sheet-actions">
      <button id="resetBtn">Reset</button>
      <button id="applyBtn">Apply</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h3 id="t_cmp_title">城市選擇（洲 → 國家 → 城市）＋比較</h3>
      <div class="row">
        <select id="continentSel"><option value="">先選洲</option></select>
        <select id="countrySel" disabled><option value="">再選國家</option></select>
        <select id="citySel" disabled><option value="">最後選城市</option></select>
        <button id="addCmpBtn">加入比較</button>
        <button id="clearCmpBtn">清空比較</button>
      </div>
      <div id="selected" style="margin-top:8px;font-size:13px;opacity:.85"></div>
      <table id="cmp" style="display:none"><thead><tr><th id="t_dim">維度</th><th id="h1"></th><th id="h2"></th><th id="h3"></th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="modal" id="cityModal"><div class="modal-box"><span class="close" id="closeCityModal">✕</span><div id="cityModalBody"></div></div></div>
  <div class="modal" id="methodModal"><div class="modal-box"><span class="close" id="closeMethodModal">✕</span><h3 id="t_meth_title">Methodology</h3><p id="t_meth_body"></p></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const i18n={zh:{title:'Retire Anywhere Lab v5.8',sub:'一起規劃夢想退休旅程，看看你的資產能在哪些城市安心生活。',filters:'篩選',panel:'篩選條件',lifestyle:'生活型態',household:'家庭型態',assets:'資產',rule:'紅點代表目前資產不足以在該城市退休。',lux:'奢華可負擔',com:'舒適可負擔',ess:'基本可負擔',no:'超出資產',cmp:'城市選擇（洲 → 國家 → 城市）＋比較',add:'加入比較',clear:'清空比較',vis:'訪客數',collapse:'收合',expand:'展開',mobileFilters:'篩選條件',apply:'套用',reset:'重設',currency:'幣別',pickCont:'先選洲',pickCountry:'再選國家',pickCity:'最後選城市',selNone:'尚未加入比較城市',selPrefix:'已選：',dim:'維度',annual:'每年資金需求',fund:'資金友善分數',cl:'天氣',vi:'簽證滿意度',he:'醫療品質',sa:'安全',ta:'稅務友善',ex:'外國人友善',en:'英文友善',total:'加權總分',methTitle:'Methodology 計算邏輯',methBody:'目標資產採用 4% 提領率（SWR）：目標資產 = 年支出 ÷ 0.04。生活型態倍率與 production 對齊：Essential 1.0x、Comfortable 1.5x、Luxury 使用城市專屬 luxury_multiplier（約 2.0x~3.5x）。若城市缺 single/family 欄位，會以 couple 成本估算並標示為估算值。',cityDetail:'城市詳情',afford:'可負擔等級',needAsset:'建議退休資產',max3:'最多比較 3 個城市',estTag:'（估算）',totalAsset:'目標總資產',currentFilter:'目前條件'},en:{title:'Retire Anywhere Lab v5.8',sub:'Plan your dream retirement journey and discover where your assets can support a happy life.',filters:'Filters',panel:'Filters',lifestyle:'Life Style',household:'Household',assets:'Assets',rule:'Red means your current assets are not enough for retirement there.',lux:'Luxury affordable',com:'Comfortable affordable',ess:'Essential affordable',no:'Over budget',cmp:'City Selector (Continent → Country → City) + Compare',add:'Add to compare',clear:'Clear',vis:'Visitors',collapse:'Collapse',expand:'Expand',mobileFilters:'Filters',apply:'Apply',reset:'Reset',currency:'Currency',pickCont:'Select continent',pickCountry:'Select country',pickCity:'Select city',selNone:'No city selected',selPrefix:'Selected: ',dim:'Metric',annual:'Annual need',fund:'Funding score',cl:'Climate',vi:'Visa satisfaction',he:'Healthcare',sa:'Safety',ta:'Tax friendliness',ex:'Expat friendliness',en:'English friendliness',total:'Weighted score',methTitle:'Methodology',methBody:'Target asset follows 4% SWR: Target Asset = Annual Cost ÷ 0.04. Lifestyle multipliers are aligned with production: Essential 1.0x, Comfortable 1.5x, and Luxury uses city-level luxury_multiplier (about 2.0x–3.5x). If single/family cost is missing, the app estimates from couple cost and marks it as estimated.',cityDetail:'City Detail',afford:'Affordability',needAsset:'Suggested retirement asset',max3:'Max 3 cities',estTag:'(Estimated)',totalAsset:'Target asset',currentFilter:'Current filters'}};

let state={lifestyle:'Comfortable',household:'couple',asset:3000000,currency:'USD',lang:'zh'},draftMobile={...state};
let cities=[],selected=[]; let map,layer;
const markerColor={Luxury:'#10b981',Comfortable:'#3b82f6',Essential:'#a855f7',None:'#ef4444'};
const fx={USD:1,NTD:32};
function t(k){return i18n[state.lang][k]||k}
function money(nUsd){ const r=fx[state.currency]||1; const sym=state.currency==='USD'?'US$':'NT$'; return sym+Math.round(nUsd*r).toLocaleString(); }
function sliderValToUsd(v){ return Number(v)/(fx[state.currency]||1); }
function usdToSliderVal(v){ return Math.round(v*(fx[state.currency]||1)); }
function labelLifestyle(v){ const m={Essential:{zh:'基本生活',en:'Essential'},Comfortable:{zh:'舒適生活',en:'Comfortable'},Luxury:{zh:'奢華生活',en:'Luxury'}}; return m[v] ? m[v][state.lang] : v; }
function labelHousehold(v){ const m={single:{zh:'單人',en:'Single'},couple:{zh:'雙人',en:'Couple'},family:{zh:'家庭',en:'Family'}}; return m[v] ? m[v][state.lang] : v; }
function labelLevel(v){ const m={Essential:{zh:'基本可負擔',en:'Essential'},Comfortable:{zh:'舒適可負擔',en:'Comfortable'},Luxury:{zh:'奢華可負擔',en:'Luxury'},None:{zh:'資產不足',en:'None'}}; return m[v] ? m[v][state.lang] : v; }
function labelCountry(v){ return state.lang==='zh' ? (countryZh[v]||v) : v; }
function labelContinent(v){ return state.lang==='zh' ? (continentZh[v]||v) : v; }
function getModeMultiplier(c,life){ if(life==='Essential') return 1; if(life==='Comfortable') return 1.5; return c.luxury_multiplier || 2; }
function getMonthlyCost(c,house){
  const s=Number(c.monthly_living_cost_single), cp=Number(c.monthly_living_cost_couple), f=Number(c.monthly_living_cost_family);
  if(house==='single'){
    if(Number.isFinite(s)&&s>0) return {value:s,estimated:false};
    if(Number.isFinite(cp)&&cp>0) return {value:cp*0.65,estimated:true};
    if(Number.isFinite(f)&&f>0) return {value:f/1.55*0.65,estimated:true};
    return {value:0,estimated:true};
  }
  if(house==='family'){
    if(Number.isFinite(f)&&f>0) return {value:f,estimated:false};
    if(Number.isFinite(cp)&&cp>0) return {value:cp*1.55,estimated:true};
    if(Number.isFinite(s)&&s>0) return {value:s/0.65*1.55,estimated:true};
    return {value:0,estimated:true};
  }
  if(Number.isFinite(cp)&&cp>0) return {value:cp,estimated:false};
  if(Number.isFinite(s)&&s>0) return {value:s/0.65,estimated:true};
  if(Number.isFinite(f)&&f>0) return {value:f/1.55,estimated:true};
  return {value:0,estimated:true};
}
function annualNeed(c,house){ const m=getMonthlyCost(c,house); return {annual:m.value*12,estimated:m.estimated}; }
function assetNeed(c,house,life){ const a=annualNeed(c,house); return {asset:(a.annual/0.04)*getModeMultiplier(c,life),estimated:a.estimated}; }
function level(c,house,asset){const e=assetNeed(c,house,'Essential').asset,k=assetNeed(c,house,'Comfortable').asset,l=assetNeed(c,house,'Luxury').asset; if(asset>=l)return'Luxury'; if(asset>=k)return'Comfortable'; if(asset>=e)return'Essential'; return'None'}
function pin(color){return L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)"></div>`,iconSize:[14,14]})}
function score(c){
  const [cl,vi,he,sa,ta,ex,en]=meta[c.country]||[6,6,6,6,6,6,6];
  const a=annualNeed(c,state.household);
  const annual=a.annual*getModeMultiplier(c,state.lifestyle);
  const fund=annual<=30000?10:annual<=45000?8:annual<=60000?6:annual<=80000?4:2;
  const total=(fund*.3+cl*.1+vi*.15+he*.15+sa*.1+ta*.1+ex*.05+en*.05).toFixed(2);
  return {annual,fund,cl,vi,he,sa,ta,ex,en,total,estimated:a.estimated};
}

function controlHtml(prefix=''){
  return `
  <div class="group"><label>${t('lifestyle')}</label><div class="btns">
    <button class="btn ${state.lifestyle==='Essential'?'active':''}" data-type="lifestyle" data-val="Essential" onclick="setChoice('${prefix}','lifestyle','Essential')">${state.lang==='zh'?'基本':'Essential'}</button>
    <button class="btn ${state.lifestyle==='Comfortable'?'active':''}" data-type="lifestyle" data-val="Comfortable" onclick="setChoice('${prefix}','lifestyle','Comfortable')">${state.lang==='zh'?'舒適':'Comfortable'}</button>
    <button class="btn ${state.lifestyle==='Luxury'?'active':''}" data-type="lifestyle" data-val="Luxury" onclick="setChoice('${prefix}','lifestyle','Luxury')">${state.lang==='zh'?'奢華':'Luxury'}</button>
  </div></div>
  <div class="group"><label>${t('household')}</label><div class="btns">
    <button class="btn ${state.household==='single'?'active':''}" data-type="household" data-val="single" onclick="setChoice('${prefix}','household','single')">${state.lang==='zh'?'單人':'Single'}</button>
    <button class="btn ${state.household==='couple'?'active':''}" data-type="household" data-val="couple" onclick="setChoice('${prefix}','household','couple')">${state.lang==='zh'?'雙人':'Couple'}</button>
    <button class="btn ${state.household==='family'?'active':''}" data-type="household" data-val="family" onclick="setChoice('${prefix}','household','family')">${state.lang==='zh'?'家庭':'Family'}</button>
  </div></div>
  <div class="group"><label>${t('currency')}</label>
  <select id="${prefix}currencySel" onchange="setCurrency('${prefix}', this.value)">
    <option value="USD" ${state.currency==='USD'?'selected':''}>USD</option>
    <option value="NTD" ${state.currency==='NTD'?'selected':''}>NTD</option>
  </select></div>
  <div class="group"><label>${t('assets')} (${state.currency}): <span class="budget" id="${prefix}budgetTxt">${money(state.asset)}</span></label>
  <input type="range" id="${prefix}assetSlider" min="${usdToSliderVal(100000)}" max="${usdToSliderVal(10000000)}" step="${usdToSliderVal(50000)}" value="${usdToSliderVal(state.asset)}" /></div>
  <div class="group" style="font-size:12px;opacity:.84">${t('rule')}</div>`;
}

function setChoice(prefix,type,val){ if(prefix==='m_'){draftMobile[type]=val; state[type]=val; updateMobileSheetUI(); renderControls(); draw(); renderCmp(); return;} state[type]=val; renderControls(); draw(); renderCmp(); }
function setCurrency(prefix,val){ if(prefix==='m_'){draftMobile.currency=val; state.currency=val; updateMobileSheetUI(); renderControls(); draw(); renderCmp(); return;} state.currency=val; renderControls(); draw(); renderCmp(); }
window.setChoice=setChoice;

function renderControls(){
  document.getElementById('panelBody').innerHTML=controlHtml('');
  document.getElementById('mobileSheetBody').innerHTML=controlHtml('m_');
  const s1=document.getElementById('assetSlider'); if(s1) s1.oninput=()=>{state.asset=sliderValToUsd(s1.value); renderControls(); draw(); renderCmp();};
  const s2=document.getElementById('m_assetSlider'); if(s2) s2.oninput=()=>{draftMobile.asset=sliderValToUsd(s2.value); state.asset=draftMobile.asset; document.getElementById('m_budgetTxt').textContent=money(draftMobile.asset); draw(); renderCmp();};
}

function updateMobileSheetUI(){
  const box=document.getElementById('mobileSheetBody');
  box.querySelectorAll(".btn[data-type='lifestyle']").forEach(b=>b.classList.toggle('active',b.dataset.val===draftMobile.lifestyle));
  box.querySelectorAll(".btn[data-type='household']").forEach(b=>b.classList.toggle('active',b.dataset.val===draftMobile.household));
  document.getElementById('m_assetSlider').value=usdToSliderVal(draftMobile.asset); document.getElementById('m_budgetTxt').textContent=money(draftMobile.asset); const cs=document.getElementById('m_currencySel'); if(cs) cs.value=draftMobile.currency||state.currency;
}

function draw(){
  layer.clearLayers();
  cities.forEach((c,i)=>{
    const lv=level(c,state.household,state.asset),color=markerColor[lv],s=score(c);
    const label=state.lang==='zh'?(c.zh||c.city):c.city;
    const mk=L.marker(c.coords,{icon:pin(color)}).addTo(layer);
    const need=assetNeed(c,state.household,state.lifestyle); const estTag=s.estimated?(' '+t('estTag')):'';
    const img=(c.img||'https://images.pexels.com/photos/1450353/pexels-photo-1450353.jpeg');
    mk.bindTooltip(`<div style="text-align:center"><b>${label}</b><br><img src="${img}" style="width:140px;height:80px;object-fit:cover;border-radius:8px;margin-top:6px"></div>`,{direction:'top',offset:[0,-8]});
    mk.bindPopup(`<b>${labelCountry(c.country)} - ${label}</b><br/>${t('currentFilter')}: ${labelLifestyle(state.lifestyle)} / ${labelHousehold(state.household)}<br/>${t('afford')}: <b style='color:${color}'>${labelLevel(lv)}</b><br/>${t('annual')}: ${money(s.annual)}${estTag}<br/>${t('needAsset')}: ${money(need.asset)}${estTag}<br/><img src='${img}' style='width:120px;height:70px;object-fit:cover;border-radius:8px;margin:6px 0'><br/><button onclick="openCityDetail(${i})">${t('cityDetail')}</button> <button onclick="addCmp(${i})">${t('add')}</button>`);
    mk.on('click',()=>openCityDetail(i));
  });
}

function openCityDetail(i){
  const c=cities[i],s=score(c),lv=level(c,state.household,state.asset);
  const name=state.lang==='zh'?(c.zh||c.city):c.city, lm=state.lang==='zh'?(c.zh_landmark||c.landmark||''):(c.landmark||''), desc=state.lang==='zh'?(c.zh_desc||c.desc||''):(c.desc||'');
  const need=assetNeed(c,state.household,state.lifestyle), estTag=s.estimated?(' '+t('estTag')):'';
  document.getElementById('cityModalBody').innerHTML=`<h3>${labelCountry(c.country)} - ${name}</h3><img class='city-img' src='${c.img||'https://images.pexels.com/photos/1450353/pexels-photo-1450353.jpeg'}'/><p>${lm}</p><p>${desc}</p><p>${t('currentFilter')}: ${labelLifestyle(state.lifestyle)} / ${labelHousehold(state.household)}</p><p>${t('afford')}: <b style='color:${markerColor[lv]}'>${labelLevel(lv)}</b></p><p>${t('annual')}: ${money(s.annual)}${estTag}</p><p>${t('needAsset')}: ${money(need.asset)}${estTag}</p>`;
  document.getElementById('cityModal').classList.add('show');
}
window.openCityDetail=openCityDetail;

function buildSelectors(){
  const c1=document.getElementById('continentSel'),c2=document.getElementById('countrySel'),c3=document.getElementById('citySel');
  const cont=[...new Set(cities.map(c=>c.continent))].sort();
  c1.innerHTML=`<option value=''>${t('pickCont')}</option>`+cont.map(v=>`<option value='${v}'>${labelContinent(v)}</option>`).join('');
  c2.innerHTML=`<option value=''>${t('pickCountry')}</option>`; c3.innerHTML=`<option value=''>${t('pickCity')}</option>`;
  c1.onchange=()=>{const cc=[...new Set(cities.filter(c=>c.continent===c1.value).map(c=>c.country))].sort(); c2.innerHTML=`<option value=''>${t('pickCountry')}</option>`+cc.map(v=>`<option value='${v}'>${labelCountry(v)}</option>`).join(''); c2.disabled=!c1.value; c3.innerHTML=`<option value=''>${t('pickCity')}</option>`; c3.disabled=true;};
  c2.onchange=()=>{const ci=cities.filter(c=>c.country===c2.value).map(c=>state.lang==='zh'?(c.zh||c.city):c.city); const orig=cities.filter(c=>c.country===c2.value).map(c=>c.city); c3.innerHTML=`<option value=''>${t('pickCity')}</option>`+orig.map((v,idx)=>`<option value='${v}'>${ci[idx]}</option>`).join(''); c3.disabled=!c2.value;};
}
function addFromSelectors(){const c1=continentSel.value,c2=countrySel.value,c3=citySel.value; const i=cities.findIndex(c=>c.continent===c1&&c.country===c2&&c.city===c3); if(i>=0)addCmp(i)}
function addCmp(i){const c=cities[i]; if(!c)return; if(selected.find(x=>x.country===c.country&&x.city===c.city))return; if(selected.length>=3)return alert(t('max3')); selected.push(c); renderCmp(); if(selected.length===1){document.getElementById('selected').scrollIntoView({behavior:'smooth',block:'center'});} } window.addCmp=addCmp;
function removeCmp(idx){ selected.splice(idx,1); renderCmp(); } window.removeCmp=removeCmp;
function clearCompare(){selected=[]; renderCmp()} 
function renderCmp(){
  selected=document.getElementById('selected')?selected:selected;
  if(!selected.length){ document.getElementById('selected').textContent=t('selNone'); } else { document.getElementById('selected').innerHTML = `${t('selPrefix')}` + selected.map((c,idx)=>`<span style='display:inline-flex;align-items:center;gap:6px;border:1px solid #36507f;border-radius:999px;padding:3px 8px;margin:2px'>${labelContinent(c.continent)}/${labelCountry(c.country)}/${state.lang==='zh'?(c.zh||c.city):c.city}<button onclick="removeCmp(${idx})" style='background:#2a3754;border:1px solid #4b638f;border-radius:999px;color:#fff;cursor:pointer;padding:0 6px'>×</button></span>`).join(''); }
  const tbl=document.getElementById('cmp'); if(selected.length<2){tbl.style.display='none'; return;} tbl.style.display='table';
  ['h1','h2','h3'].forEach((id,idx)=>document.getElementById(id).textContent=selected[idx]?`${labelCountry(selected[idx].country)}-${state.lang==='zh'?(selected[idx].zh||selected[idx].city):selected[idx].city}`:'-');
  const m=selected.map(score), needAssets=selected.map(c=>assetNeed(c,state.household,state.lifestyle));
  const rows=[[t('currentFilter'),...m.map(()=>`${labelLifestyle(state.lifestyle)} / ${labelHousehold(state.household)}`)],[t('annual'),...m.map(x=>money(x.annual)+(x.estimated?(' '+t('estTag')):''))],[t('totalAsset'),...needAssets.map(x=>money(x.asset)+(x.estimated?(' '+t('estTag')):''))],[t('fund'),...m.map(x=>x.fund)],[t('cl'),...m.map(x=>x.cl)],[t('vi'),...m.map(x=>x.vi)],[t('he'),...m.map(x=>x.he)],[t('sa'),...m.map(x=>x.sa)],[t('ta'),...m.map(x=>x.ta)],[t('ex'),...m.map(x=>x.ex)],[t('en'),...m.map(x=>x.en)],[t('total'),...m.map(x=>x.total)]];
  const tb=tbl.querySelector('tbody'); tb.innerHTML=''; rows.forEach((r,ri)=>{const tr=document.createElement('tr'); r.forEach((v,ci)=>{const td=document.createElement('td'); td.textContent=v; if(ri===rows.length-1&&ci>0)td.className='score'; tr.appendChild(td)}); tb.appendChild(tr)});
}

async function updateVisitorCount(){
  try{
    const res=await fetch('https://api.countapi.xyz/hit/amoleskyhigh.github.io/retire-map-lab-v5');
    const data=await res.json();
    if(data && typeof data.value==='number'){
      document.getElementById('visitor-val').textContent=data.value.toLocaleString();
      return;
    }
  }catch(e){}
  const key='retire_lab_v5_local_visits';
  let v=parseInt(localStorage.getItem(key)||'0',10)+1;
  localStorage.setItem(key,String(v));
  document.getElementById('visitor-val').textContent=v.toLocaleString();
}

function applyLang(){
  document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';
  t_title.textContent=t('title'); t_sub.textContent=t('sub'); t_filters.textContent=t('filters'); t_panel.textContent=t('panel');
  t_lg_lux.textContent=t('lux'); t_lg_com.textContent=t('com'); t_lg_ess.textContent=t('ess'); t_lg_no.textContent=t('no');
  t_cmp_title.textContent=t('cmp'); addCmpBtn.textContent=t('add'); clearCmpBtn.textContent=t('clear'); t_visitors.textContent=t('vis');
  t_mobile_filters.textContent=t('mobileFilters'); applyBtn.textContent=t('apply'); resetBtn.textContent=t('reset'); t_dim.textContent=t('dim');
  toggleBtn.textContent=panel.classList.contains('collapsed')?t('expand'):t('collapse'); methodBtn.textContent='Method';
  t_meth_title.textContent=t('methTitle'); t_meth_body.textContent=t('methBody'); langBtn.textContent=state.lang==='zh'?'EN':'中文';
  renderControls(); buildSelectors(); draw(); renderCmp();
}

async function init(){
  map=L.map('map',{worldCopyJump:true,zoomControl:false,maxBounds:[[-85,-270],[85,270]],maxBoundsViscosity:1,minZoom:2}).setView([20,10],2);
  L.control.zoom({position:'topleft'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map); layer=L.layerGroup().addTo(map);

  const base=await fetch('./world_retirement_data.json').then(r=>r.json());
  const merged={...base,...batch6};
  cities=[];
  Object.keys(merged).forEach(country=>{
    Object.entries(merged[country].Cities||{}).forEach(([city,info])=>cities.push({continent:countryCont[country]||'Other',country,city,...info}));
  });

  renderControls(); buildSelectors(); draw(); renderCmp(); updateVisitorCount(); applyLang();

  addCmpBtn.onclick=addFromSelectors; clearCmpBtn.onclick=clearCompare;
  toggleBtn.onclick=()=>{panel.classList.toggle('collapsed'); toggleBtn.textContent=panel.classList.contains('collapsed')?t('expand'):t('collapse')};
  langBtn.onclick=()=>{state.lang=state.lang==='zh'?'en':'zh'; applyLang();};

  mobileFab.onclick=()=>{draftMobile={...state}; mobileSheet.classList.add('show'); renderControls(); updateMobileSheetUI();};
  closeSheetBtn.onclick=()=>mobileSheet.classList.remove('show');
  resetBtn.onclick=()=>{draftMobile={lifestyle:'Comfortable',household:'couple',asset:3000000,currency:'USD',lang:state.lang}; state={...draftMobile}; renderControls(); draw(); renderCmp();};
  applyBtn.onclick=()=>{state={...draftMobile}; mobileSheet.classList.remove('show'); applyLang();};

  methodBtn.onclick=()=>methodModal.classList.add('show'); closeMethodModal.onclick=()=>methodModal.classList.remove('show');
  closeCityModal.onclick=()=>cityModal.classList.remove('show');
  cityModal.onclick=(e)=>{if(e.target.id==='cityModal')cityModal.classList.remove('show')};
  methodModal.onclick=(e)=>{if(e.target.id==='methodModal')methodModal.classList.remove('show')};
}

init().catch(e=>alert('Init failed: '+e.message));
</script>
