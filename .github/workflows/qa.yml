name: Retire Anywhere QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  city-image-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Vietnam city images and click-flow hooks
        run: python tests/qa_vietnam_city_images.py
      - name: Validate all repository-local city image assets
        run: python tests/qa_city_image_assets.py
